[package]
name = "mrs"
version = "0.1.0"
edition = "2024"
description = "mrs — a small, dark, menu-less text editor built with egui"
publish = false

[[bin]]
name = "mrs"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "clipboard"] }
rfd = "0.18.0"
